kind = "web"
previewPath = "/"
title = "Digital Nomad Hub"
version = "1.0.0"
id = "artifacts/digital-nomad-hub"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21939

[services.development]
run = "pnpm --filter @workspace/digital-nomad-hub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/digital-nomad-hub", "run", "build" ]
publicDir = "artifacts/digital-nomad-hub/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21939"
BASE_PATH = "/"
